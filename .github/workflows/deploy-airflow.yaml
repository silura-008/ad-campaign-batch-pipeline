name: AIRFLOW CI/CD

on:
  push:
    branches:
      - 'feature/**'
      - main
    paths:
      - 'dags/**'
      - '.github/workflows/deploy-airflow.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'dags/**'
      - '.github/workflows/deploy-airflow.yaml'

  workflow_dispatch:

env:
  ARTIFACT_BUCKET: ad-artifacts-bkt

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade pip

      - run: |
          pip install "apache-airflow==2.10.3" \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.11.txt
          pip install apache-airflow-providers-amazon pytest

      - run: pytest tests/

  deploy-dev:
    needs: validate
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    env:
      ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1

      - run: |
          aws s3 sync dags/ s3://${ENV}-${ARTIFACT_BUCKET}/dags/ --delete

  deploy-prod:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1

      - run: |
          aws s3 sync dags/ s3://${ENV}-${ARTIFACT_BUCKET}/dags/ --delete