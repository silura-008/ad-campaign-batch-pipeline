name: Airflow ci/cd

on:
  push:
    branches:
      - 'feature/**'
      - main
    paths:
      - 'dags/**'
      - '.github/workflows/deploy-airflow.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'dags/**'
      - '.github/workflows/deploy-airflow.yaml'

  workflow_dispatch:

env:
  ARTIFACT_BUCKET: ad-artifacts-bkt

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
  
    container:
      image: apache/airflow:2.10.3-python3.11
      options: --user airflow
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Install providers and pytest
        run: |
          pip install \
            apache-airflow-providers-amazon==8.29.0 \
            pytest \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.11.txt
  
      - name: Run pytest
        run: pytest tests/
        
  deploy-dev:
    name: Deploy to dev
    needs: validate
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    env:
      ENV: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync dags to dev S3
        run: |
          aws s3 sync dags/ s3://${ENV}-${ARTIFACT_BUCKET}/dags/ --delete

  deploy-prod:
    name: Deploy to production
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync dags to production S3
        run: |
          aws s3 sync dags/ s3://${ENV}-${ARTIFACT_BUCKET}/dags/ --delete